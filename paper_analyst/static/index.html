<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper_analyst</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #efefea; --line: #dcdcd4; --line-strong: #c4c4ba;
  --text: #1d1d1b; --text-2: #5b5b55; --text-3: #6f6f68;
  --accent: #2f5d8a; --accent-ink: #ffffff; --accent-soft: #e4ecf4;
  --concl-bg: #f3efe2; --concl-line: #ddd3b5; --concl-label: #6e5a1c;
  --ok: #2e6b3f; --warn: #8a5a12; --err: #a3322b; --err-soft: #f8e6e4;
  --radius: 6px; --radius-lg: 10px;
  --fs-cap: .75rem; --fs-label: .8125rem; --fs-body: .9375rem; --fs-h3: 1rem; --fs-h2: 1.1875rem; --fs-h1: 1.375rem;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1e1f1d; --panel-2: #262724; --line: #33342f; --line-strong: #474840;
    --text: #e9e8e2; --text-2: #b0afa6; --text-3: #95948b;
    --accent: #8db4dc; --accent-ink: #10202f; --accent-soft: #22303d;
    --concl-bg: #2a2719; --concl-line: #4a4227; --concl-label: #d9c27a;
    --ok: #7fc08f; --warn: #e0b36a; --err: #ec8a80; --err-soft: #3a2220;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: var(--fs-body)/1.6 var(--font); color: var(--text); background: var(--bg); word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* 셸 */
.top { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 700; letter-spacing: -.01em; }
.chip { font-size: var(--fs-cap); color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; color: var(--text-2); font-weight: 600; }
.tab:hover { background: var(--panel-2); color: var(--text); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab .n { font-weight: 400; font-variant-numeric: tabular-nums; margin-left: 4px; }
.spacer { flex: 1; }
.btn.chat-toggle { display: none; }
.brand, .tab, .chip { white-space: nowrap; }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr) 400px; height: calc(100% - 48px); }
.col { min-height: 0; display: flex; flex-direction: column; }
.col + .col { border-left: 1px solid var(--line); }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }

/* 버튼 */
.btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; font-size: var(--fs-label); font-weight: 600; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.quiet { border-color: transparent; background: none; color: var(--text-2); }
.btn.quiet:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* 서재 */
.lib-head { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
.search { width: 100%; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.filters .btn { padding: 2px 8px; font-weight: 500; font-size: var(--fs-cap); }
.group { padding: 10px 12px 2px; font-size: var(--fs-cap); color: var(--text-3); font-weight: 700; display: flex; justify-content: space-between; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-radius: 0; }
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item > span { display: block; }
.item .t { font-weight: 600; font-size: var(--fs-label); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { font-size: var(--fs-cap); color: var(--text-3); font-variant-numeric: tabular-nums; }
.item .c { font-size: var(--fs-cap); color: var(--text-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.new { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 4px; }
.lock { font-size: 10px; color: var(--text-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 4px; font-weight: 500; }

/* 가운데 */
.main { background: var(--panel); }
.doc { max-width: 820px; margin: 0 auto; padding: 24px 32px 64px; }
.doc h1.title { font-size: var(--fs-h1); line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
.meta { color: var(--text-2); font-size: var(--fs-label); font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 18px; }
.bar .lbl { font-size: var(--fs-cap); color: var(--text-3); margin-right: 2px; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; border-left: 1px solid var(--line-strong); }
.seg .btn:first-child { border-left: 0; }
.seg .btn[aria-pressed="true"] { box-shadow: none; }
.meta a { color: var(--accent); padding: 4px 0; }   /* 글 줄 안 링크지만 누를 자리는 넓게 */
.concl { background: var(--concl-bg); border: 1px solid var(--concl-line); border-radius: var(--radius-lg); padding: 12px 16px; margin: 0 0 14px; display: block; width: 100%; text-align: left; }
button.concl { cursor: pointer; }
button.concl:hover { border-color: var(--concl-label); }
.concl .k { font-size: var(--fs-cap); font-weight: 700; color: var(--concl-label); display: block; margin-bottom: 2px; }
.concl .v { margin: 0; font-weight: 600; line-height: 1.55; display: block; }
/* 홈 목록: 굵은 벽이 되지 않게 보통 굵기 + 3줄까지 */
.concl.card .v { font-weight: 400; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.concl.card .k { font-size: var(--fs-label); color: var(--text); margin-bottom: 4px; }
.concl.card:hover { border-color: var(--accent); }
details.src-meta { font-size: var(--fs-cap); color: var(--text-3); margin: 0 0 8px; }
details.src-meta summary { cursor: pointer; }
details.src-meta ul { margin: 4px 0 0; }
.md { line-height: 1.7; }
.md h1 { font-size: var(--fs-h2); } .md h2 { font-size: var(--fs-h2); margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); }
.md h3 { font-size: var(--fs-h3); margin-top: 20px; }
.md table { border-collapse: collapse; width: 100%; font-size: var(--fs-label); margin: 10px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; text-align: left; }
.md th { background: var(--panel-2); }
.md code { font-family: var(--mono); font-size: .85em; background: var(--panel-2); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--panel-2); padding: 10px; border-radius: var(--radius); overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 8px 0; padding: 4px 12px; color: var(--text-2); border-left: 2px solid var(--line-strong); }
details.private { margin-top: 28px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 8px 14px; }
details.private summary { cursor: pointer; font-weight: 600; font-size: var(--fs-label); color: var(--text-2); }

/* 태그·연결·내 메모 */
.sec { margin: 0 0 16px; }
.sec-h { font-size: var(--fs-cap); font-weight: 700; color: var(--text-3); margin-bottom: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: var(--fs-cap); border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 0 0 10px; display: inline-flex; align-items: center; background: var(--panel); }
.tag button { border: 0; background: none; cursor: pointer; color: var(--text-3); padding: 0 8px; min-height: 24px; border-radius: 999px; }
.tag button:hover { color: var(--err); }
button.tag.sug { border-style: dashed; color: var(--text-2); padding: 2px 10px; cursor: pointer; min-height: 24px; }
button.tag.sug:hover { border-color: var(--accent); color: var(--accent); }
.tag-input { font-size: var(--fs-cap); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; width: 150px; background: var(--panel); }
.links { list-style: none; margin: 0; padding: 0; }
.links li { display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-label); padding: 2px 0; }
.links .kind { font-size: var(--fs-cap); color: var(--text-2); flex-shrink: 0; min-width: 96px; }
.links button.go { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-weight: 500; }
.links button.go:hover { text-decoration: underline; }
.links .note { color: var(--text-3); font-size: var(--fs-cap); }
.linkform { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.linkform select { padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); max-width: 100%; font-size: var(--fs-label); }
.linkform select#link-dst { flex: 1 1 200px; min-width: 0; width: 100%; }
.hint { font-size: var(--fs-cap); color: var(--text-3); }
.memo textarea { width: 100%; min-height: 84px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 10px; background: var(--panel); line-height: 1.5; resize: vertical; }
.memo .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 4px; }

/* 발행 */
.pub-head { padding: 16px 24px 8px; border-bottom: 1px solid var(--line); }
.pub-groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.pub-group { min-width: 0; }
.pub-group > .gh { font-size: var(--fs-cap); color: var(--text-3); font-weight: 700; margin: 0 0 2px; padding: 2px 0; }
details.pub-group > summary.gh { cursor: pointer; list-style-position: inside; }
.pub-rows { display: flex; flex-direction: column; gap: 2px; }
.pub-row { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  border-radius: var(--radius); padding: 6px 8px; cursor: pointer; color: var(--text); font-size: var(--fs-label); min-height: 32px; min-width: 0; }
.pub-row:hover { background: var(--panel-2); }
.pub-row[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pub-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pub-row .m { font-size: var(--fs-cap); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pub-row.is-done .t { font-weight: 500; color: var(--text-2); }
.pub-row.is-done .m b { color: var(--ok); font-weight: 600; }
.pub-none { font-size: var(--fs-label); color: var(--text-3); padding: 4px 8px; margin: 0; }
.pub-body { padding: 16px 24px 48px; max-width: 860px; }
.ptabs { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.ptabs .spacer { flex: 1; }
.warn { border: 1px solid var(--err); background: var(--err-soft); color: var(--err); border-radius: var(--radius); padding: 8px 12px; font-size: var(--fs-label); margin-bottom: 10px; }
.warn ul { margin: 4px 0 0; padding-left: 18px; }
.okline { font-size: var(--fs-cap); color: var(--ok); margin-bottom: 10px; }
.preview-plain { white-space: pre-wrap; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; background: var(--panel); line-height: 1.7; }
.preview-plain .fold { border-top: 1px dashed var(--line-strong); margin: 6px 0; font-size: var(--fs-cap); color: var(--text-3); }
pre.preview-src { white-space: pre-wrap; font-family: var(--mono); font-size: var(--fs-cap); background: var(--panel-2); border-radius: var(--radius); padding: 12px; max-height: 60vh; overflow: auto; }

.pubbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px 12px; margin-bottom: 10px; background: var(--panel); font-size: var(--fs-label); }
.pubbar .spacer { flex: 1; }
.pubbar .done { color: var(--ok); font-weight: 600; }
dialog.confirm { border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 18px 20px; max-width: 440px; width: calc(100% - 32px); background: var(--panel); color: var(--text); }
dialog.confirm::backdrop { background: rgba(0,0,0,.35); }
dialog.confirm h2 { font-size: var(--fs-h3); margin: 0 0 8px; }
dialog.confirm p { margin: 0 0 8px; font-size: var(--fs-label); color: var(--text-2); }
dialog.confirm .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* 비교 */
.cmp-head { padding: 16px 24px 0; }
.cmp-wrap { overflow-x: auto; padding: 12px 24px 48px; }
table.cmp { border-collapse: separate; border-spacing: 0; font-size: var(--fs-label); line-height: 1.6; }
table.cmp th, table.cmp td { vertical-align: top; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); min-width: 260px; max-width: 380px; }
table.cmp th.row { min-width: 92px; width: 92px; font-size: var(--fs-cap); color: var(--text-3); position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.cmp thead th { border-bottom: 2px solid var(--line-strong); }
table.cmp thead .t { font-weight: 700; display: block; }
table.cmp td.verdict { background: var(--concl-bg); font-weight: 600; }
table.cmp td p { margin: 0 0 4px; } table.cmp td ul, table.cmp td ol { margin: 2px 0; padding-left: 18px; }
table.cmp .empty-cell { color: var(--text-3); }
.empty { color: var(--text-2); padding: 48px 32px; max-width: 560px; margin: 0 auto; }
.empty h2 { font-size: var(--fs-h2); color: var(--text); margin: 0 0 8px; }
.ex { font-family: var(--mono); font-size: var(--fs-label); background: var(--panel-2); padding: 2px 6px; border-radius: 3px; }
.abstract { color: var(--text-2); }
.skeleton { height: 14px; background: var(--panel-2); border-radius: 4px; margin: 10px 0; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* 후보함 */
.cand-head { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; z-index: 1; }
.cand-head .hint { color: var(--text-3); font-size: var(--fs-cap); margin-left: auto; }
.cand { border-bottom: 1px solid var(--line); padding: 12px 24px; border-left: 3px solid transparent; }
.cand.sel { background: var(--panel-2); border-left-color: var(--accent); }
.cand .row { display: flex; gap: 12px; align-items: flex-start; }
.cand .info { flex: 1; min-width: 0; }
.cand button.t { border: 0; background: none; padding: 2px 0; min-height: 28px; text-align: left; cursor: pointer; font-weight: 600; line-height: 1.4; }
.cand button.t::before { content: '▸ '; color: var(--text-3); }
.cand button.t[aria-expanded="true"]::before { content: '▾ '; }
.cand button.t:hover { color: var(--accent); }
.sig { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; font-size: var(--fs-cap); color: var(--text-2); font-variant-numeric: tabular-nums; }
.sig .hit { color: var(--accent); font-weight: 700; }
.cand-head .keys { font-size: var(--fs-cap); color: var(--text-3); width: 100%; }
.cand-head .keys kbd { font-family: var(--mono); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; }
.cand .acts { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
.cand .abstract { margin-top: 8px; font-size: var(--fs-label); line-height: 1.65; }

/* 대화 */
.chat { background: var(--bg); }
.chat-head { padding: 10px 12px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
.chat-head select { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
.menu { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 6px; width: 300px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--panel-2); }
.menu button:disabled { cursor: not-allowed; }
.menu .n, .menu .d { display: block; }
.menu .d { font-size: var(--fs-cap); color: var(--text-2); line-height: 1.45; }
.menu button:disabled .n { color: var(--text-3); }
.sess { font-size: var(--fs-cap); color: var(--text-2); padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.sess:empty { display: none; }
.sess b { color: var(--text); }
.sess .when { white-space: nowrap; }
/* 건너뛰기: Tab 을 처음 누를 때만 보인다 */
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--panel); color: var(--accent); border: 2px solid var(--accent);
  border-radius: var(--radius); padding: 8px 12px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 8px; }
.skip[data-skip="chat"] { left: 120px; }   /* 숨어 있을 때도 서로 겹치지 않게 */
#main:focus { outline: none; }
.msgs { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 100%; line-height: 1.6; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 8px 12px; border-radius: var(--radius-lg); max-width: 88%; white-space: pre-wrap; }
.msg.user .ctx { display: block; font-size: var(--fs-cap); color: var(--text-2); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.bot { background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: var(--radius-lg); }
.msg.bot p { margin: 0 0 6px; } .msg.bot p:last-child { margin: 0; }
.msg.bot ul { margin: 4px 0; padding-left: 18px; }
.msg.bot code { font-family: var(--mono); font-size: .85em; background: var(--panel-2); padding: 0 3px; border-radius: 3px; }
.tool { font-size: var(--fs-cap); color: var(--text-2); display: flex; gap: 6px; align-items: baseline; padding: 0 4px; }
.tool .nm { font-weight: 700; color: var(--text); flex-shrink: 0; }
.tool .s { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tool .st { flex-shrink: 0; margin-left: auto; }
.tool .st.run { color: var(--warn); } .tool .st.ok { color: var(--ok); } .tool .st.bad { color: var(--err); }
.tool-err { font-size: var(--fs-cap); color: var(--err); background: var(--err-soft); padding: 4px 8px; border-radius: var(--radius); margin: -4px 4px 0; white-space: pre-wrap; }
.endline { font-size: var(--fs-cap); color: var(--text-3); text-align: center; }
.endline.bad { color: var(--err); }
.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
.attach { display: flex; align-items: center; gap: 6px; font-size: var(--fs-cap); color: var(--text-2); margin-bottom: 6px; min-height: 24px; }
.attach .chip { color: var(--text); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.attach .lbl { white-space: nowrap; }
.composer textarea { width: 100%; resize: none; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 10px; min-height: 64px; max-height: 200px; background: var(--panel); line-height: 1.5; }
.composer textarea:disabled { background: var(--panel-2); }
.composer .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; align-items: center; }
.composer .row .note { margin-right: auto; font-size: var(--fs-cap); color: var(--text-3); }
.notice { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--panel); font-size: var(--fs-label); color: var(--text-2); }
.notice b { color: var(--text); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); font-size: var(--fs-label); z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }

  .top { gap: 6px; padding: 0 10px; } .top .chip.profile { display: none; } .brand { font-size: var(--fs-label); } .tabs { margin-left: 0; } .tab { padding: 6px 8px; }
}

<body>
<nav class="skips" aria-label="건너뛰기"><a class="skip" href="#main" data-skip="main">본문으로</a><a class="skip" href="#input" data-skip="chat">대화로</a></nav>
<header class="top">
  <span class="brand">paper_analyst</span>
  <span class="chip profile" id="profile" title="현재 프로필">프로필 확인 중…</span>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-lib" aria-selected="true">서재</button>
    <button class="tab" role="tab" id="tab-cand" aria-selected="false">후보함<span class="n" id="cand-n"></span></button>
    <button class="tab" role="tab" id="tab-cmp" aria-selected="false" hidden>비교<span class="n" id="cmp-n"></span></button>
    <button class="tab" role="tab" id="tab-pub" aria-selected="false">발행<span class="n" id="pub-n"></span></button>
  </nav>
  <span class="spacer"></span>
  <button class="btn quiet" id="lib-toggle" style="display:none">목록</button>
  <button class="btn chat-toggle" id="chat-toggle">대화</button>
</header>

<div class="shell">
  <aside class="col lib" aria-label="서재">
    <div class="lib-head">
      <input class="search" id="q" type="search" placeholder="제목·결론·arXiv id 검색" aria-label="서재 검색">
      <div class="filters" id="filters"></div>
      <div class="filters" id="tagfilters"></div>
    </div>
    <div class="scroll" id="lib-list"></div>
  </aside>

  <main class="col main"><div class="scroll" id="main"></div></main>

  <section class="col chat" aria-label="대화">
    <div class="chat-head">
      <select id="chat-sel" aria-label="대화 고르기"></select>
      <button class="btn" id="new-chat" aria-haspopup="menu">새 대화</button>
    </div>
    <div class="sess" id="sess"></div>
    <div class="scroll" id="msgs-wrap"><div class="msgs" id="msgs"></div></div>
    <div class="composer">
      <div class="attach" id="attach"></div>
      <textarea id="input" placeholder="예: 10~11월 에이전트 논문 후보 찾아줘 / 이 논문 정리해줘" aria-label="메시지"></textarea>
      <div class="row">
        <span class="note">Enter 보내기 · Shift+Enter 줄바꿈</span>
        <button class="btn" id="stop" style="display:none">중지</button>
        <button class="btn primary" id="send">보내기</button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="confirm" id="li-dialog" aria-labelledby="li-dialog-h">
  <h2 id="li-dialog-h">LinkedIn 에 게시</h2>
  <p id="li-dialog-body"></p>
  <p>올린 뒤에는 LinkedIn 에서 직접 지워야 합니다.</p>
  <div class="row"><button class="btn" id="li-cancel">취소</button><button class="btn primary" id="li-confirm">게시</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opt = {}) {
  const r = await fetch(path, { method: opt.method || 'GET', headers: { 'Content-Type': 'application/json' },
    body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.detail || `요청 실패 (${r.status})`), { status: r.status });
  return data;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }
const fmtDate = s => (s || '').slice(0, 10);
const fmtWhen = d => `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const fmtN = n => Number(n || 0).toLocaleString('ko-KR');

const S = {
  view: 'lib', lib: null, sel: null, filter: 'all', q: '', seen: null, fresh: new Set(),
  cand: null, candView: 'signal', openAbs: new Set(), abs: {},
  backends: [], chats: [], chatId: null, es: null, running: false, attach: true, tools: {},
  tag: null, cmp: loadCmp(), paper: null, posts: [], post: null, ptab: 'linkedin',
};
const ORDER = ['to_read', 'noted', 'applied', 'fetched', 'hold'];
function loadCmp() { try { return JSON.parse(localStorage.getItem('pa.cmp') || '[]'); } catch { return []; } }
function saveCmp() { try { localStorage.setItem('pa.cmp', JSON.stringify(S.cmp)); } catch { /* 저장 안 돼도 이번 화면에선 동작 */ } renderCmpTab(); }
function renderCmpTab() {
  const n = S.cmp.length;
  $('#tab-cmp').hidden = n === 0 && S.view !== 'cmp';
  $('#cmp-n').textContent = n || '';
}

/* ── 서재 ─────────────────────────────────── */
// 목록을 다시 그려도 키보드 포커스가 body 로 날아가지 않게: 같은 항목(같은 id·data 값)에 다시 둔다
function focusKey(e) {
  if (!e || e === document.body) return null;
  if (e.id) return '#' + CSS.escape(e.id);
  for (const k of ['key', 'f', 'tagf', 'paper', 'post', 'cv', 'ptab', 'abs']) if (e.dataset && e.dataset[k] !== undefined) return `[data-${k}="${CSS.escape(e.dataset[k])}"]`;
  return null;
}
function keepFocus(fn) {
  const a = document.activeElement, key = focusKey(a);
  fn();
  if (key && !document.contains(a)) document.querySelector(key)?.focus({ preventScroll: true });
}
async function loadLib(markFresh = false) {
  const lib = await api('/api/library');
  if (markFresh && S.seen) {
    for (const p of lib.papers) {
      const old = S.seen[p.id];
      if (old === undefined || (p.noted_at && p.noted_at !== old)) S.fresh.add(p.id);
    }
  }
  S.seen = Object.fromEntries(lib.papers.map(p => [p.id, p.noted_at]));
  S.lib = lib;
  keepFocus(() => { renderFilters(); renderLib(); renderAttach(); });
  if (markFresh && S.view === 'lib') {
    if (S.sel && S.sel.kind === 'paper') showPaper(S.sel.id, true); else if (!S.sel) welcome();
  }
}
function renderFilters() {
  if (!S.lib) return;   // 서재를 불러오기 전에 다른 탭을 누른 경우 — 불러오면 다시 그린다
  const c = S.lib.counts, names = S.lib.status_names;
  const opts = [['all', '전체', S.lib.papers.length], ...ORDER.map(k => [k, names[k], c[k]])];
  $('#filters').innerHTML = opts.map(([k, n, v]) =>
    `<button class="btn" data-f="${k}" aria-pressed="${S.filter === k}">${esc(n)} ${v}</button>`).join('');
  const tags = Object.entries(S.lib.tags || {});
  if (S.tag && !(S.tag in (S.lib.tags || {}))) S.tag = null;
  $('#tagfilters').innerHTML = tags.length
    ? '<span class="hint">태그</span>' + tags.map(([t, n]) => `<button class="btn" data-tagf="${esc(t)}" aria-pressed="${S.tag === t}">${esc(t)} ${n}</button>`).join('')
    : '';
}
function matches(p) {
  if (S.filter !== 'all' && p.status !== S.filter) return false;
  if (S.tag && !(p.tags || []).includes(S.tag)) return false;
  if (!S.q) return true;
  return (p.title + ' ' + p.id + ' ' + (p.conclusion || '')).toLowerCase().includes(S.q.toLowerCase());
}
// 서재 목록은 Tab 한 번에 지나간다: 항목 하나만 tabindex=0, 안에서는 ↑↓·Home·End
function rove(focusEl) {
  const items = [...$('#lib-list').querySelectorAll('.item')];
  if (!items.length) return;
  const on = focusEl || items.find(e => e.dataset.key === S.libFocus) || items.find(e => e.getAttribute('aria-current') === 'true') || items[0];
  for (const e of items) e.tabIndex = e === on ? 0 : -1;
  if (focusEl) { S.libFocus = focusEl.dataset.key; focusEl.focus(); focusEl.scrollIntoView({ block: 'nearest' }); }
}
function renderLib() {
  if (!S.lib) return;   // 서재를 불러오기 전에 다른 탭을 누른 경우 — 불러오면 다시 그린다
  const names = S.lib.status_names, out = [];
  for (const st of ORDER) {
    if (S.filter !== 'all' && S.filter !== st) continue;
    const ps = S.lib.papers.filter(p => p.status === st && matches(p))
      .sort((a, b) => (b.noted_at || 0) - (a.noted_at || 0) || b.id.localeCompare(a.id));
    if (!ps.length) continue;
    out.push(`<div class="group"><span>${esc(names[st])}</span><span>${ps.length}</span></div>`);
    for (const p of ps) {
      const cur = S.sel && S.sel.kind === 'paper' && S.sel.id === p.id;
      out.push(`<button class="item" data-key="p:${esc(p.id)}" data-paper="${esc(p.id)}" aria-current="${cur}">
        <span class="t">${esc(p.title)}${S.fresh.has(p.id) ? '<span class="new">새로 정리됨</span>' : ''}</span>
        <span class="m">${esc(p.id)}${p.published ? ' · ' + esc(fmtDate(p.published)) : ''}${p.has_private ? '<span class="lock">개인 메모</span>' : ''}</span>
        ${p.conclusion ? `<span class="c">${esc(p.conclusion)}</span>` : ''}</button>`);
    }
  }
  if (S.filter === 'all' && !S.tag) {
    const q = S.q.toLowerCase();
    const docs = S.lib.docs.filter(d => !q || (d.title + d.name).toLowerCase().includes(q));
    for (const [kind, label] of [['lists', '목록'], ['ideas', '아이디어']]) {
      const ds = docs.filter(d => d.kind === kind);
      if (!ds.length) continue;
      out.push(`<div class="group"><span>${label}</span><span>${ds.length}</span></div>`);
      for (const d of ds) {
        const cur = S.sel && S.sel.kind === 'doc' && S.sel.name === d.name;
        out.push(`<button class="item" data-key="d:${esc(d.kind)}/${esc(d.name)}" data-doc="${esc(d.kind)}/${esc(d.name)}" aria-current="${cur}">
          <span class="t">${esc(d.title)}</span>
          <span class="m">${esc(d.name.replace('.private', ''))}${d.has_private ? `<span class="lock">${d.private_only ? '비공개' : '개인 메모'}</span>` : ''}</span></button>`);
      }
    }
  }
  $('#lib-list').innerHTML = out.join('') || (S.lib.papers.length || S.lib.docs.length
    ? `<div class="empty"><p>“${esc(S.q)}”에 맞는 항목이 없습니다.</p></div>`
    : `<div class="empty"><h2>서재가 비어 있습니다</h2><p>오른쪽 대화창에서 <span class="ex">2603.28052 정리해줘</span>처럼 시키면 정리된 논문이 여기에 쌓입니다.</p></div>`);
  rove();
}

async function showPaper(id, quiet = false) {
  S.sel = { kind: 'paper', id }; S.fresh.delete(id);
  if (!quiet) $('#main').innerHTML = `<div class="doc"><div class="skeleton" style="width:60%;height:24px"></div><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></div>`;
  renderLib(); renderAttach(); document.body.classList.remove('show-lib');
  let p;
  try { p = await api(`/api/papers/${encodeURIComponent(id)}`); }
  catch (e) { $('#main').innerHTML = `<div class="empty"><h2>논문을 열지 못했습니다</h2><p>${esc(e.message)}</p></div>`; return; }
  if (!(S.sel && S.sel.id === id) || S.view !== 'lib') return;
  S.paper = p;
  const names = S.lib.status_names;
  const inCmp = S.cmp.includes(p.id);
  const manual = ['applied', 'hold'].includes(p.status) ? p.status : null;
  const auto = p.has_notes ? 'noted' : (p.status === 'to_read' ? 'to_read' : 'fetched');
  // 상태는 한 묶음: 파일 기준(자동) | 적용함 | 보류 — 자동을 누르면 수동 표시를 되돌린다
  const stBtns = `<span class="seg" role="group" aria-label="상태">${[['', names[auto]], ['applied', '적용함'], ['hold', '보류']].map(([k, n]) =>
    `<button class="btn" data-st="${k}" aria-pressed="${(manual || '') === k}">${esc(n)}</button>`).join('')}</span>`;
  const ask = p.has_notes
    ? `<button class="btn" data-ask="이 논문 notes 를 다시 확인하고, 빠진 외부 평가가 있으면 보강해줘">다시 정리 시키기</button>`
    : `<button class="btn primary" data-ask="이 논문 paper-read 로 정리해줘">Claude 에게 정리 시키기</button>`;
  p.authors = (p.authors || []).filter(a => /[A-Za-z가-힣]{2}/.test(a));
  const authors = p.authors && p.authors.length ? ' · ' + esc(p.authors.slice(0, 3).join(', ')) + (p.authors.length > 3 ? ` 외 ${p.authors.length - 3}명` : '') : '';
  $('#main').innerHTML = `<article class="doc">
    <h1 class="title">${esc(p.title)}</h1>
    <div class="meta"><a href="${esc(p.abs_url)}" target="_blank" rel="noopener">arXiv ${esc(p.id)}</a>${p.published ? ' · 발표 ' + esc(fmtDate(p.published)) : ''}${p.category ? ' · ' + esc(p.category) : ''}${authors}</div>
    <div class="bar">
      <span class="lbl">상태</span>${stBtns}
      <span class="sep"></span>${ask}
      ${p.has_notes ? `<button class="btn" data-cmp="${esc(p.id)}" aria-pressed="${inCmp}">${inCmp ? '비교에서 빼기' : '비교에 담기'}</button>
        <button class="btn" data-ask="이 논문으로 paper-post 글 초안 만들어줘 (LinkedIn·블로그)">글 초안 만들기</button>` : ''}
    </div>
    ${p.conclusion ? `<div class="concl"><span class="k">결론</span><span class="v">${esc(p.conclusion)}</span></div>` : ''}
    ${paperExtras(p)}
    ${p.notes_html ? `<div class="md" id="notes">${p.notes_html}</div>`
      : `<div class="empty" style="padding:8px 0"><h2>아직 정리되지 않았습니다</h2>
         ${p.abstract ? `<p><b>초록</b><br><span class="abstract">${esc(p.abstract)}</span></p>` : ''}
         <p><b>Claude 에게 정리 시키기</b>를 누르면 대화창으로 요청이 가고, 정리가 끝나면 이 자리에 notes 가 나타납니다.</p></div>`}
    ${p.private_html ? `<details class="private"><summary>개인 메모 (비공개 — notes.private.md, git 제외)</summary><div class="md">${p.private_html}</div></details>` : ''}
  </article>`;
  dedupe($('#notes'), p);
}
const LINK_TEXT = {   // 방향 있는 연결의 읽는 법 (out = 이 논문 → 상대, in = 상대 → 이 논문)
  out: { follows: '이 논문은 다음의 후속', refutes: '이 논문이 반박', agrees: '같은 방향', related: '관련' },
  in: { follows: '이 논문의 후속', refutes: '이 논문을 반박', agrees: '같은 방향', related: '관련' },
};
function paperExtras(p) {
  const tags = `<div class="sec"><div class="sec-h">태그</div><div class="tags">
    ${p.tags.map(t => `<span class="tag">${esc(t)}<button data-tagdel="${esc(t)}" aria-label="태그 ${esc(t)} 빼기" title="빼기">×</button></span>`).join('')}
    ${p.suggest_tags.map(t => `<button class="tag sug" data-tagadd="${esc(t)}" title="notes 의 '관심 주제와의 연결'에 나온 주제">+ ${esc(t)}</button>`).join('')}
    <input class="tag-input" id="tag-in" placeholder="태그 직접 입력" aria-label="태그 직접 입력"></div></div>`;
  const others = S.lib.papers.filter(x => x.id !== p.id && !p.links.some(l => l.other === x.id) && x.status !== 'to_read')
    .sort((a, b) => (b.has_notes - a.has_notes) || a.title.localeCompare(b.title));
  const kinds = S.lib.link_kinds || {};
  const links = `<div class="sec"><div class="sec-h">연결</div>
    ${p.links.length ? `<ul class="links">${p.links.map(l => `<li><span class="kind">${esc(LINK_TEXT[l.direction][l.kind] || l.kind_name)}</span>
        <button class="go" data-paper="${esc(l.other)}">${esc(l.other_title)}</button>${l.note ? `<span class="note">${esc(l.note)}</span>` : ''}
        <button class="btn quiet" data-linkdel="${l.id}" aria-label="연결 지우기">지우기</button></li>`).join('')}</ul>` : ''}
    ${p.suggest_links.length ? `<div class="tags" style="margin-top:4px"><span class="hint">notes 에 나온 논문</span>
        ${p.suggest_links.map(s => `<button class="tag sug" data-linkpre="${esc(s.id)}" title="연결할 논문으로 고르기">+ ${esc(s.title)}</button>`).join('')}</div>` : ''}
    ${others.length ? `<div class="linkform"><select id="link-kind" aria-label="연결 종류">${Object.entries(kinds).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select>
        <select id="link-dst" aria-label="연결할 논문"><option value="">연결할 논문 고르기</option>${others.map(x => `<option value="${esc(x.id)}">${esc(x.title.slice(0, 70))}</option>`).join('')}</select>
        <button class="btn" id="link-add">연결</button></div>` : (p.links.length ? '' : '<span class="hint">서재에 연결할 다른 논문이 없습니다</span>')}
    </div>`;
  const memo = p.can_memo
    ? `<details class="sec memo" ${p.memo ? 'open' : ''}><summary class="sec-h" style="cursor:pointer">내 메모 (비공개 — memo.private.md, git 제외)</summary>
        <textarea id="memo" aria-label="내 메모" placeholder="이 논문에서 시험해 볼 것, 반론, 내 작업과의 연결…">${esc(p.memo)}</textarea>
        <div class="row"><span class="hint" id="memo-st"></span><button class="btn" id="memo-save">메모 저장</button></div></details>`
    : '';
  return tags + links + memo;
}
async function saveTags(tags) {
  try { await api(`/api/papers/${S.paper.id}/tags`, { method: 'PUT', body: { tags } }); await loadLib(); showPaper(S.paper.id, true); }
  catch (e) { toast(e.message); }
}
async function renderCompare() {
  renderCmpTab();
  if (!S.cmp.length) {
    $('#main').innerHTML = `<div class="empty"><h2>비교할 논문이 없습니다</h2><p>정리된 논문을 열고 <b>비교에 담기</b>를 누르면 결론을 나란히 볼 수 있습니다.</p></div>`;
    return;
  }
  let rows;
  try { rows = await api(`/api/compare?ids=${S.cmp.map(encodeURIComponent).join(',')}`); }
  catch (e) {   // 서재에서 사라진 논문은 비교에서 뺀다
    if (e.status === 404) { const ok = new Set(S.lib.papers.map(p => p.id)); S.cmp = S.cmp.filter(i => ok.has(i)); saveCmp(); return renderCompare(); }
    $('#main').innerHTML = `<div class="empty"><h2>비교를 불러오지 못했습니다</h2><p>${esc(e.message)}</p></div>`; return;
  }
  if (S.view !== 'cmp') return;
  const LABELS = ['가져갈 것', '믿어도 되는 결과', '해석에 주의할 결과', '읽는다면'];
  const cell = (r, lab) => {

function dedupe(md, p) {   // 위에 이미 보인 제목·결론 문장은 notes 본문에서 뺀다

  const lead = md.querySelector(':scope > ul:first-child');

    d.innerHTML = '<summary>출처·읽은 범위·정리 시각</summary>'; lead.replaceWith(d); d.appendChild(lead);
  }

    $('#msgs').innerHTML = `<div class="notice"><b>새 대화</b>로 시작하세요. 세션은 둘 중 하나를 고릅니다.<br>
      · <b>Claude Code</b> — 저장소 스킬(paper-find·paper-read·paper-setup)로 찾고 읽고 정리합니다. 대화 내용이 Anthropic 으로 전송됩니다.<br>
      · <b>로컬 LLM</b> — 이 컴퓨터의 Qwen 으로 서재 조회·제목 찾기·받기만 합니다. 정리는 하지 않습니다.</div>`;
    setComposer(false); return;
  }
  const when = c.updated_at ? new Date(c.updated_at * 1000) : null;
  const ago = when ? (Date.now() - when) / 864e5 : 0;   // 일 단위
  $('#sess').innerHTML = `세션 <b>${esc(bname(c.backend))}</b>${c.backend === 'claude' ? ' · 내용이 Anthropic 으로 전송됨' : ' · 이 컴퓨터 안에서만'}`
    + (when && !S.running ? ` · <span class="when" title="${esc(when.toLocaleString('ko-KR'))}">마지막 대화 ${esc(fmtWhen(when))}${ago >= 1 ? ' (지난 대화)' : ''}</span>` : '')
    + (b && !b.available ? ` · <span style="color:var(--err)">지금 쓸 수 없음</span>` : '');
  const ok = !b || b.available;
  setComposer(ok);
  if (!ok) $('#msgs').insertAdjacentHTML('beforeend', `<div class="notice" id="locked">${esc(b.how)}</div>`);
}
function setComposer(on) {
  $('#input').disabled = !on || S.running; $('#send').disabled = !on || S.running;
  $('#stop').style.display = S.running ? '' : 'none';
}
function renderAttach() {
  const p = S.sel && S.sel.kind === 'paper' && S.lib && S.lib.papers.find(x => x.id === S.sel.id);
  $('#attach').innerHTML = p
    ? (S.attach ? `<span class="lbl">함께 보낼 논문</span><span class="chip" title="${esc(p.title)}">${esc(p.title)}</span><button class="btn quiet" id="detach">빼기</button>`
                : `<button class="btn quiet" id="reattach">보고 있는 논문 붙이기</button>`) : '';
}
function openChat(id) {
  if (S.es) S.es.close();
  S.chatId = Number(id); S.tools = {};
  S.running = !!(S.chats.find(c => c.id === S.chatId) || {}).running;
  $('#msgs').innerHTML = ''; renderSess();
  S.replaying = true; clearTimeout(S.replayT);   // 기록을 다 받을 때까지 스크롤을 미뤘다가, 마지막 질문부터 보이게
  S.es = new EventSource(`/api/chats/${S.chatId}/stream?after=0`);
  S.es.onmessage = m => onEvent(JSON.parse(m.data));
}
function mdLite(t) {
  const lines = esc(t).split('\n'); let html = '', list = false;
  for (const l of lines) {
    const li = l.match(/^\s*[-*] (.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${li[1]}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (l.trim()) html += `<p>${l}</p>`;
  }
  if (list) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function onEvent(e) {
  const box = $('#msgs'), d = e.data, wrap = $('#msgs-wrap');
  const atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;
  const add = h => { const l = $('#locked'); l ? l.insertAdjacentHTML('beforebegin', h) : box.insertAdjacentHTML('beforeend', h); };
  if (e.type === 'user') {
    S.running = true; setComposer(true);
    add(`<div class="msg user">${d.paper ? `<span class="ctx">${esc(d.paper.title || d.paper.id)}</span>` : ''}${esc(d.text)}</div>`);
  } else if (e.type === 'text') add(`<div class="msg bot">${mdLite(d.text)}</div>`);
  else if (e.type === 'tool') {
    add(`<div class="tool" id="tool-${e.id}"><span class="nm">${esc(d.name)}</span><span class="s" title="${esc(d.summary)}">${esc(d.summary)}</span><span class="st run">진행 중</span></div>`);
    S.tools[d.id] = e.id;
  } else if (e.type === 'tool_done') {
    const el = $(`#tool-${S.tools[d.id]}`);
    if (el) { const st = el.querySelector('.st'); st.className = 'st ' + (d.ok ? 'ok' : 'bad'); st.textContent = d.ok ? '완료' : '거부·실패'; }
    if (!d.ok && d.summary) add(`<div class="tool-err">${esc(d.summary)}</div>`);
  } else if (e.type === 'library_changed') {
    // 지난 기록을 다시 받는 중이면 서재는 이미 최신 — 다시 불러오지 않는다
    if (!S.replaying) { loadLib(true); loadCand(); if (S.view === 'pub') loadPub(); else loadPubCount(); }
  } else if (e.type === 'error') add(`<div class="endline bad">${esc(d.message)}</div>`);
  else if (e.type === 'done') {
    if (d.denied && d.denied.length) add(`<div class="endline bad">허용 목록 밖의 도구 ${d.denied.length}건이 거부됐습니다 (${esc([...new Set(d.denied)].join(', '))})</div>`);
  } else if (e.type === 'run_end') {
    S.running = false;
    const msg = { canceled: '중지했습니다', interrupted: d.message || '서버가 다시 켜져 끊겼습니다', failed: '답하지 못하고 끝났습니다' }[d.status];
    if (msg) add(`<div class="endline bad">${esc(msg)}</div>`);
    else if (d.cost) add(`<div class="endline" title="Claude 구독(Pro/Max)으로 로그인했으면 추가 요금 없이 사용량 한도에서만 차감됩니다. API 키로 쓰면 이 금액이 청구됩니다.">API 요금 환산 약 $${Number(d.cost).toFixed(2)} · 구독이면 사용량만 차감</div>`);
    box.querySelectorAll('.st.run').forEach(s => { s.className = 'st bad'; s.textContent = '끝나지 않음'; });
    renderSess();
    if (!S.replaying) { loadChats(); loadLib(true); loadCand(); }
  }
  if (S.replaying) { clearTimeout(S.replayT); S.replayT = setTimeout(endReplay, 150); return; }
  if (atBottom || e.type === 'user') wrap.scrollTop = wrap.scrollHeight;
}
function endReplay() {
  S.replaying = false;
  const wrap = $('#msgs-wrap'), last = [...$('#msgs').querySelectorAll('.msg.user')].pop();
  if (S.running) loadLib(true);   // 답하는 중에 열었으면 재생 사이에 온 '서재 바뀜'을 한 번 반영
  if (S.running || !last) { wrap.scrollTop = wrap.scrollHeight; return; }
  // 마지막 질문과 그 답의 처음이 위에 오게 (답 끝의 잘린 문장부터 보이지 않게)
  wrap.scrollTop += last.getBoundingClientRect().top - wrap.getBoundingClientRect().top - 8;
}
async function send(text) {
  text = (text ?? $('#input').value).trim();
  if (!text) return;
  if (!S.chatId) { toast('먼저 새 대화를 만드세요'); document.body.classList.add('chat-open'); return; }
  const paper = S.attach && S.sel && S.sel.kind === 'paper' ? S.sel.id : null;
  try {
    S.running = true; setComposer(true);
    await api(`/api/chats/${S.chatId}/messages`, { method: 'POST', body: { text, paper_id: paper } });
    if (text === $('#input').value.trim()) $('#input').value = '';
    document.body.classList.add('chat-open');
  } catch (e) { S.running = false; renderSess(); toast(e.message); }
}
function newChatMenu(btn) {
  if ($('.menu')) { $('.menu').remove(); return; }
  const r = btn.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, r.right - 300) + 'px';
  const desc = { claude: '스킬로 찾기·읽기·정리. 서재에 notes 를 씁니다. 내용이 Anthropic 으로 전송됩니다.',
                 local: '이 컴퓨터의 Qwen. 서재 조회·제목 찾기·받기만 합니다.' };
  m.innerHTML = S.backends.map(b => `<button role="menuitem" data-backend="${b.name}" ${b.available ? '' : 'disabled'}>
    <span class="n"><b>${esc(b.label)}</b>${b.available ? '' : ' — 꺼져 있음'}</span>
    <span class="d">${esc(b.available ? desc[b.name] || '' : b.how)}</span></button>`).join('');
  document.body.appendChild(m);
  m.querySelector('button:not(:disabled)')?.focus();
}
function setTabs(v) {
  S.view = v;
  for (const k of ['lib', 'cand', 'cmp', 'pub']) $('#tab-' + k).setAttribute('aria-selected', v === k);
  renderCmpTab();
}
function setView(v) {
  setTabs(v);
  if (v === 'pub') { S.sel = null; renderLib(); renderAttach(); $('#main').innerHTML = '<div class="doc"><div class="skeleton"></div><div class="skeleton"></div></div>'; loadPub(); }
  else if (v === 'cmp') { S.sel = null; renderLib(); renderAttach(); $('#main').innerHTML = '<div class="doc"><div class="skeleton"></div><div class="skeleton"></div></div>'; renderCompare(); }
  else if (v === 'cand') { S.sel = null; renderLib(); renderAttach(); $('#main').innerHTML = '<div class="doc"><div class="skeleton"></div><div class="skeleton"></div></div>'; loadCand(); }
  else if (S.sel && S.sel.kind === 'paper') showPaper(S.sel.id); else welcome();
}

/* ── 이벤트 연결 ──────────────────────────── */
document.addEventListener('click', async ev => {
  const sum = ev.target.closest('#pub-done > summary');   // 사용자가 직접 접고 편 상태만 기억
  if (sum) S.pubDoneOpen = !sum.parentElement.open;
  const t = ev.target.closest('button');
  if (!t || (!t.closest('.menu') && t.id !== 'new-chat')) $('.menu')?.remove();
  if (!t) return;
  if (t.dataset.paper) { if (S.view !== 'lib') setTabs('lib'); return showPaper(t.dataset.paper); }
  if (t.dataset.doc) { const [k, n] = t.dataset.doc.split('/'); if (S.view !== 'lib') setTabs('lib'); return showDoc(k, n); }
  if (t.dataset.f) { S.filter = t.dataset.f; renderFilters(); renderLib(); return; }
  if (t.dataset.tagf) { S.tag = S.tag === t.dataset.tagf ? null : t.dataset.tagf; renderFilters(); renderLib(); return; }
  if (t.dataset.tagdel) return saveTags(S.paper.tags.filter(x => x !== t.dataset.tagdel));
  if (t.dataset.tagadd) return saveTags([...S.paper.tags, t.dataset.tagadd]);
  if (t.dataset.linkpre) { const s = $('#link-dst'); if (s) { s.value = t.dataset.linkpre; $('#link-kind').focus(); } return; }
  if (t.dataset.linkdel) {
    try { await api(`/api/links/${t.dataset.linkdel}`, { method: 'DELETE' }); toast('연결을 지웠습니다'); showPaper(S.paper.id, true); } catch (e) { toast(e.message); } return;
  }
  if (t.dataset.cmp) {
    const id = t.dataset.cmp;
    S.cmp = S.cmp.includes(id) ? S.cmp.filter(x => x !== id) : [...S.cmp, id]; saveCmp();
    toast(S.cmp.includes(id) ? `비교에 담았습니다 (${S.cmp.length}편)` : '비교에서 뺐습니다');
    return showPaper(id, true);
  }
  if (t.dataset.post) { S.post = t.dataset.post; return loadPub(); }
  if (t.dataset.ptab) { S.ptab = t.dataset.ptab; return renderPub(); }
  if (t.dataset.copy) return copyText(t.dataset.copy, t);
  if (t.dataset.uncmp) { S.cmp = S.cmp.filter(x => x !== t.dataset.uncmp); saveCmp(); return renderCompare(); }
  if (t.dataset.st !== undefined) {
    try { await api(`/api/papers/${S.sel.id}/status`, { method: 'PUT', body: { status: t.dataset.st || null } });
      await loadLib(); showPaper(S.sel.id, true); toast(t.dataset.st ? `${t.textContent}(으)로 표시했습니다` : '파일 기준 상태로 되돌렸습니다'); }
    catch (e) { toast(e.message); } return;
  }
  if (t.dataset.ask) return send(t.dataset.ask);
  if (t.dataset.cv) { S.candView = t.dataset.cv; return loadCand(); }
  if (t.dataset.abs) {
    const id = t.dataset.abs; S.candSel = id;
    if (S.openAbs.has(id)) { S.openAbs.delete(id); return renderCand(); }
    S.openAbs.add(id); renderCand();
    if (S.abs[id] === undefined) { try { S.abs[id] = (await api(`/api/candidates/${id}/abstract`)).abstract; } catch { S.abs[id] = ''; } renderCand(); }
    return;
  }
  if (t.dataset.dec !== undefined) {
    const id = t.dataset.id, dec = t.dataset.dec || null;
    if (dec && S.cand) S.candIdx = S.cand.items.findIndex(x => x.id === id);   // 판정 뒤에는 같은 자리(다음 후보)를 고른다
    try { await api(`/api/candidates/${id}/decision`, { method: 'PUT', body: { decision: dec } });
      toast(dec ? `${DEC_NAMES[dec]}(으)로 옮겼습니다` : '되돌렸습니다');
      await Promise.all([loadCand(), loadLib()]); } catch (e) { toast(e.message); } return;
  }
  if (t.dataset.backend) {
    $('.menu')?.remove();
    try { const c = await api('/api/chats', { method: 'POST', body: { backend: t.dataset.backend } }); await loadChats(c.id); $('#input').focus(); }
    catch (e) { toast(e.message); } return;
  }
  switch (t.id) {
    case 'new-chat': return newChatMenu(t);
    case 'send': return send();
    case 'stop': try { await api(`/api/chats/${S.chatId}/cancel`, { method: 'POST' }); } catch (e) { toast(e.message); } return;
    case 'detach': S.attach = false; return renderAttach();
    case 'reattach': S.attach = true; return renderAttach();
    case 'tab-lib': return setView('lib');
    case 'tab-cand': return setView('cand');
    case 'tab-cmp': return setView('cmp');
    case 'tab-pub': return setView('pub');
    case 'li-publish': {
      const d = S.postData;
      $('#li-dialog-body').textContent = `‘${S.li.name}’ 계정에 전체 공개로 게시합니다. ${fmtN(d.linkedin.check.chars)}자, 미리보기에 보이는 글 그대로 올라갑니다.`;
      $('#li-dialog').showModal(); $('#li-cancel').focus(); return;
    }
    case 'li-cancel': return $('#li-dialog').close();
    case 'li-confirm': {
      const btn = $('#li-confirm'); btn.disabled = true; btn.textContent = '게시 중…';
      try { const r = await api(`/api/posts/${encodeURIComponent(S.post)}/linkedin`, { method: 'POST', body: { sha: S.postData.linkedin.sha } });
        $('#li-dialog').close(); toast('LinkedIn 에 게시했습니다'); await loadPub(); }
      catch (e) { $('#li-dialog').close(); toast(e.message); await loadPub(); }
      finally { btn.disabled = false; btn.textContent = '게시'; } return;
    }
    case 'li-disconnect':
      try { await api('/api/linkedin/disconnect', { method: 'POST' }); toast('LinkedIn 연결을 끊었습니다'); await loadPub(); } catch (e) { toast(e.message); } return;
    case 'link-add': {
      const dst = $('#link-dst').value, kind = $('#link-kind').value;
      if (!dst) { toast('연결할 논문을 고르세요'); $('#link-dst').focus(); return; }
      try { await api('/api/links', { method: 'POST', body: { src: S.paper.id, dst, kind } }); toast('연결했습니다'); showPaper(S.paper.id, true); }
      catch (e) { toast(e.message); } return;
    }
    case 'memo-save': {
      const st = $('#memo-st');
      try { st.textContent = '저장 중…'; await api(`/api/papers/${S.paper.id}/memo`, { method: 'PUT', body: { text: $('#memo').value } });
        st.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); S.paper.memo = $('#memo').value; }
      catch (e) { st.textContent = ''; toast(e.message); } return;
    }
    case 'chat-toggle': return document.body.classList.toggle('chat-open');
    case 'lib-toggle': return document.body.classList.toggle('show-lib');
  }
});
$('#lib-list').addEventListener('keydown', e => {
  const items = [...$('#lib-list').querySelectorAll('.item')], i = items.indexOf(document.activeElement);
  if (i < 0) return;
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
  if (to === undefined) return;
  e.preventDefault(); rove(items[Math.max(0, Math.min(items.length - 1, to))]);
});
$('#lib-list').addEventListener('focusin', e => { const it = e.target.closest('.item'); if (it) S.libFocus = it.dataset.key; });
document.addEventListener('click', e => {   // 건너뛰기 링크: 본문 / 대화 입력(잠겨 있으면 새 대화 버튼)
  const a = e.target.closest('a[data-skip]'); if (!a) return;
  e.preventDefault();
  if (a.dataset.skip === 'main') { const m = $('#main'); m.tabIndex = -1; m.focus(); }
  else { document.body.classList.add('chat-open'); ($('#input').disabled ? $('#new-chat') : $('#input')).focus(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('.menu')?.remove(); document.body.classList.remove('chat-open'); } });
$('#input').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중 Enter 는 글자 확정
  send();
});
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderLib(); });
document.addEventListener('keydown', e => {   // 태그 직접 입력 (한글 조합 중 Enter 무시), 메모 Ctrl+Enter 저장
  if (e.target.id === 'tag-in' && e.key === 'Enter') {
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229) return;
    const v = e.target.value.trim(); if (v) saveTags([...S.paper.tags, v]);
  } else if (e.target.id === 'memo' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#memo-save').click(); }
});
$('#chat-sel').addEventListener('change', e => e.target.value && openChat(e.target.value));
const mq = matchMedia('(max-width: 760px)');
const narrow = () => { $('#lib-toggle').style.display = mq.matches ? '' : 'none'; };
mq.addEventListener('change', narrow); narrow();

(async () => {
  try {
    await Promise.all([loadStatus(), loadLib()]);
    if (location.hash === '#pub') { setView('pub'); history.replaceState(null, '', '/'); } else welcome();
    renderCmpTab(); loadCand(); loadPubCount(); await loadChats();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty"><h2>서버에 연결하지 못했습니다</h2><p>${esc(e.message)}<br>터미널에서 <span class="ex">python -m paper_analyst serve</span> 가 켜져 있는지 확인하세요.</p></div>`;
  }
})();
</script>
</body>
