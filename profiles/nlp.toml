# paper_analyst 프로필 — NLP·LLM 응용 (예시)
# 범용 도구는 이 파일만 바꿔서 다른 분야에 쓴다. 근거는 docs/SOURCES.md.
# interests / watch / discover 는 예시 값 — 각자 관심에 맞게 바꿔 쓴다.

name = "nlp"
description = "NLP·LLM 응용 개발(Agent, RAG, Memory, Harness 등) 논문 탐색"

# 따라잡기 구간 시작. 발표 3개월 미만은 '최근' 구간으로 본다.
catchup_from = "2025-06-01"
# 인용 수를 신호로 쓰기 시작하는 최소 경과 개월 (측정: 2026-10 논문 인용 중앙값 0.5)
citation_min_age_months = 3

[reader]
# 누가 어떤 관점으로 읽나 — paper-find 판정과 paper-read 정리가 이걸 따른다
language = "ko"   # notes·목록 출력 언어 (기술 용어·고유명사·수식은 원문)
lens = "실무 적용 — 새로 쓸 기법·지표·설계를 우선, 이미 아는 원칙을 확인만 하는 연구는 뒤로. 연구적 평가는 근거 강도 표시로만"
criteria = [
  "학습이 필요한가 — 모델을 다시 학습해야 쓰나, 프롬프트·하네스·시스템 설계로 가져올 수 있나",
  "새로 얻는 것 — 새로 쓸 기법·지표·설계가 있나 (확인형보다 새 기법 우선). 실험 방법을 비판·확인하는 논문은: 확인만 하면 보류, 쓰려던 방법을 반박하거나 평가 설계에 쓸 체크리스트를 주면 읽기 — 결론·실험 설계 절만",
  "관심 주제와의 접점 — interests.topics 중 실제로 닿는 것",
  "재현 수단 — 코드·데이터·벤치마크 공개 여부",
]

[interests]
# 관심 주제 — 후보 판정(제목·초록)과 notes 의 "관심 주제와의 연결" 에 쓴다
topics = [
  # 하네스·스킬·자동 개선
  "agent harness", "agent skills", "harness auto-improvement", "agent trajectory triage",
  # 생성·평가
  "long-form document generation", "LLM-as-a-judge", "rubric evaluation", "evaluation without ground truth",
  # RAG·메모리·컨텍스트
  "retrieval augmented generation", "agent memory", "context compaction", "multi-turn conversation",
  # 모델·학습·서빙
  "model technical reports", "on-policy distillation", "LLM serving",
]

[watch]
# 순위와 무관하게 후보에 넣는 모델 계열·기관·키워드 (HF 검색으로 찾는다)
models = ["Qwen", "Nemotron", "DeepSeek", "Gemma"]
keywords = ["harness", "skill", "memory", "vLLM"]

# ── 소스 4경로 ─────────────────────────────────────────────

[sources.hype]            # 화제성: HF Daily upvote
enabled = true
api = "https://huggingface.co/api/daily_papers"   # ?month=YYYY-MM | week=YYYY-Www | date=YYYY-MM-DD, limit<=100, p=페이지
min_upvotes = 20          # 측정: 놓친 주목 논문들이 upvote 20~80 구간에 있었음
use_for = "recent"        # 따라잡기 구간에선 '어떤 모델이 나왔나' 제목 훑기만

[sources.impact]          # 영향력: Semantic Scholar 인용 수
enabled = true
api = "https://api.semanticscholar.org/graph/v1"  # paper/batch (ARXIV:id, 500개), paper/search/bulk (sort=citationCount:desc)
fields_of_study = "Computer Science"
use_for = "catchup"

[sources.curated]         # 선별: 학회 수상작·전문가 정리 — 등급을 반드시 같이 기록
enabled = true
conferences = [
  { name = "EMNLP 2026",   url = "https://2026.emnlp.org/program/awards/", grades = ["Best Paper", "Outstanding", "SAC Highlight"] },
  { name = "ACL 2026",     url = "",  note = "공식 수상 페이지 미확인 (2차 출처만)" },
  { name = "ICLR 2026",    url = "https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/" },
  { name = "ICML 2026",    url = "https://blog.icml.cc/?p=1347" },
  { name = "NeurIPS 2025", url = "",  note = "미조사" },
]
curators = [
  { name = "Sebastian Raschka", url = "https://magazine.sebastianraschka.com/p/llm-research-papers-2026-part1", note = "2026 1~5월, 일부 유료" },
]

[sources.watch]           # 관심 목록: [watch] 의 이름으로 HF 검색
enabled = true
api = "https://huggingface.co/api/papers/search"  # ?q=

[sources.pwc]             # 깊이 보기용 (후보 찾기 아님): tasks·methods·벤치마크 순위·HF 모델 링크
enabled = true
api = "https://paperswithcode.co/api/v1/papers/"  # {arxiv_id} | ?search=  — 비공개 API, 실패해도 진행

# ── 후보 찾기 (paper_analyst/discover.py) ──────────────────────────
[discover]
sources = ["hf", "hn", "s2", "kw"] # hf·hn 은 AI·개발 쪽 소스 — 다른 분야면 ["s2", "kw"]
# 관심 키워드 HF 검색 (kw 소스) — 걸리면 신호 기준과 무관하게 후보. 2026-11-15: 생성 쪽 좋은 논문(Who is the Agent to Blame,
# AutoSciRub)이 인용·HN·스타 신호 0 이라 기준으로는 못 잡아서 추가 (기준값은 그대로, 키워드 경로를 따로 둠)
# 넓은 주제(하네스·스킬·메모리·on-policy·컨텍스트)는 신호로 잘 잡혀서 키워드에서 뺐다 — 넣었을 때 10~11월 신호 통과 12 → 121편
# (늘어난 109편 중 넓은 검색어가 대부분, 2026-11-15 측정). 신호가 약한 영역만 둔다. watch.models 도 검색어로 쓰인다.
keywords = [
  "long-form generation consistency", "report generation agent", "rubric induction evaluation", "citation faithfulness",
  "LLM-as-a-judge reliability", "multi-turn conversation",
]
s2_fields = ["Computer Science"]   # Semantic Scholar fieldsOfStudy
# 주제 필터: 제목 + HF 키워드에 include 중 하나가 있고, 제목에 exclude 가 없으면 통과 (대소문자 무시, 정규식)
include = [
  '\bllms?\b', 'language model', '\bagent', 'retriev', '\brag\b', 'memory', 'harness', '\bskills?\b',
  'context', 'judge', 'evaluat', 'benchmark', 'prompt', 'reasoning', 'distill', 'tool[- ]use',
  'long[- ]horizon', 'inference', 'serving', 'token',
]
exclude = [
  '\bimage', '\bvideo', '\bvision', '\bvisual', '\b3d\b', '\brobot', 'embodied', 'diffusion',
  '\bspeech', '\baudio', 'medical', 'clinical', 'molecul', 'protein', 'autonomous driving',
]
# 신호 기준 — 하나라도 넘으면 후보 (합산하지 않음). 근거: docs/SOURCES.md
thresholds = { stars = 1000, hn = 100, cit = 150 }
hf_pages = 5            # HF 월별 목록을 월당 최대 5 × 100편
hn_min_points = 20      # HN 수집 하한 (기준 hn 과 별개 — 저장 파일에는 남김)
# S2 주제별 인용순 검색어 (2026-11-15 실무 재조사에서 쓴 목록)
s2_topics = [
  "context engineering LLM agent", "LLM agent tool use", "LLM-as-a-judge evaluation reliability",
  "agent evaluation benchmark", "prompt optimization LLM", "document generation LLM",
  "structured output LLM", "LLM inference serving efficiency", "agent skills", "agent harness",
  "retrieval augmented generation", "agent memory", "long-horizon agent context management",
  "model context protocol",
]
